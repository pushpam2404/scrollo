name: Build

on:
  push: { branches: [main] }
  pull_request:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: ./build.sh --no-install
      - name: Check the bundle
        run: |
          test -x build/Scrollo.app/Contents/MacOS/Scrollo
          test -d build/Scrollo.app/Contents/Resources/Sounds
          codesign --verify --deep --strict build/Scrollo.app
      - name: Universal build
        run: ./scripts/package.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Scrollo-ci
          path: dist/*.zip
          retention-days: 7
