<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="style.css">
<style>
 .stage { width:1600px; height:800px; }
 .left { position:absolute; left:120px; top:150px; width:700px; }
 .icon { width:150px; height:150px; margin-bottom:26px; }
 h1 { font-size:132px; font-weight:700; letter-spacing:-5px; line-height:1; margin-bottom:22px; }
 .tag { font-size:40px; line-height:1.25; color:#cfdcd7; font-weight:500; letter-spacing:-.5px; margin-bottom:14px; }
 .sub { font-size:23px; color:var(--mute); margin-bottom:34px; }
 .chips { display:flex; gap:12px; flex-wrap:wrap; }
 .win { position:absolute; left:900px; top:96px; width:430px; border-radius:18px; }
 .panel { position:absolute; left:1226px; top:262px; width:310px; border-radius:18px; }
</style></head><body>
<div class="stage"><div class="grid"></div>
  <div class="left">
    <img class="icon shadow" src="../images/icon-512.png">
    <h1 class="grad">Scrollo</h1>
    <div class="tag">Satisfying clicks for every scroll.</div>
    <div class="sub">A native macOS menu bar app. Free and open source.</div>
    <div class="chips"><span class="chip"><i class="dot"></i>macOS 14+</span><span class="chip"><i class="dot"></i>Apple Silicon &amp; Intel</span><span class="chip"><i class="dot"></i>MIT licensed</span></div>
  </div>
  <img class="win shadow" src="../images/settings-sound.png">
  <img class="panel shadow" src="../images/menu-panel.png">
</div></body></html>
